services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - .:/app
      # Anonymous volumes prevent host directories from overwriting container
      # equivalents. node_modules must match the Alpine Linux platform, and
      # .next must not carry macOS Turbopack cache into a Linux container.
      - /app/node_modules
      - /app/.next
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      # NextAuth v5 uses AUTH_URL to build redirect URLs.
      # Without this it falls back to the container's bind address (0.0.0.0:3000).
      - AUTH_URL=http://localhost:${HOST_PORT:-3000}
